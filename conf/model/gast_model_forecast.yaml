name: gast
phase: actor-only

target:
  _target_: src.model.forecasting_module.ForecastingLightningModule
  model:
    type: 'TrajectoryForecaster'
    embed_dim: 128
    future_steps: 12
    num_heads: 8
    mlp_ratio: 4.0
    qkv_bias: False
    drop_path: 0.2
    num_actor_types: 1
    num_modes: 20
    dt: 0.4
    obs_len: 8
    bimamba: ${bimamba}
    encoder_type: 'gast'
    gast_depth: 4
    gast_gsm_operator: 'max'
    gast_temporal_direction: 'unidirectional'
    gast_oer_spatial: true
    gast_emc_temporal: true
    gast_ewhr_readout: true
    # Goal-conditioned decoding and trajectory-aware mode ranking are
    # intrinsic parts of GAST, not a separate model variant.
    gast_goal: true
    goal_endpoint_loss_weight: 1.0
    mode_diversity_loss_weight: 0.05
    mode_diversity_margin: 0.5
    classification_target_mode: 'trajectory'
    loss_mode: 'final_consistent'
  pretrained_weights: ${pretrained_weights}
  lr: ${lr}
  weight_decay: ${weight_decay}
  epochs: ${epochs}
  warmup_epochs: ${warmup_epochs}
