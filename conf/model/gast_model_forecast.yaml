name: gast

target:
  _target_: src.model.forecasting_module.ForecastingLightningModule
  model:
    type: 'TrajectoryForecaster'
    embed_dim: 128
    future_steps: 12
    num_heads: 8
    mlp_ratio: 4.0
    qkv_bias: False
    drop_path: 0.2
    num_modes: 20
    dt: 0.4
    obs_len: 8
    encoder_depth: 4
    interaction_operator: 'max'
    use_interaction_bias: true
    use_source_filter: true
    use_state_strength_modulation: true
    use_state_strength_readout: true
    use_goal_guidance: true
    # Endpoint-guided decoding and trajectory-aware mode ranking are
    # intrinsic parts of GAST, not a separate model variant.
    goal_endpoint_loss_weight: 1.0
    mode_diversity_loss_weight: 0.05
    mode_diversity_margin: 0.5
  pretrained_weights: ${pretrained_weights}
  lr: ${lr}
  weight_decay: ${weight_decay}
  epochs: ${epochs}
  warmup_epochs: ${warmup_epochs}
