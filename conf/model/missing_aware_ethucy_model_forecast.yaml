name: missing_aware_ethucy
phase: actor-only

target:
  _target_: src.model.forecasting_module.ForecastingLightningModule
  model:
    type: 'TrajectoryForecaster'
    embed_dim: 128
    future_steps: 12
    num_heads: 8
    mlp_ratio: 4.0
    qkv_bias: False
    drop_path: 0.2
    num_actor_types: 1
    num_modes: 20
    dt: 0.4
    obs_len: 8
    # bimamba 仅用于 M0 对照；GAST-PF-UniOER 固定使用因果单向 Mamba。
    bimamba: ${bimamba}
    # 当前主模型：GAST-PF-UniOER；M0 由对照实验显式指定。
    encoder_type: 'gast'
    gast_depth: 4
    gast_gsm_operator: 'max'
    # UniOER：OER 空间关系 + 单向证据调制 Mamba + 证据加权历史读出。
    gast_temporal_direction: 'unidirectional'
    gast_oer_spatial: true
    gast_emc_temporal: true
    gast_ewhr_readout: true
  pretrained_weights: ${pretrained_weights}
  lr: ${lr}
  weight_decay: ${weight_decay}
  epochs: ${epochs}
  warmup_epochs: ${warmup_epochs}
