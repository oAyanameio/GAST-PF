name: missing_aware_ethucy
phase: actor-only

target:
  _target_: src.model.forecasting_module.ForecastingLightningModule
  model:
    type: 'TrajectoryForecaster'
    embed_dim: 128
    future_steps: 12
    num_heads: 8
    mlp_ratio: 4.0
    qkv_bias: False
    drop_path: 0.2
    num_actor_types: 1
    num_modes: 20
    dt: 0.4
    obs_len: 8
    # 主链配置：GAST-PF 自带前向/反向时序状态分支；bimamba 仅保留给 M0 对照路径。
    bimamba: ${bimamba}
    # 正式模型：GAST-PF 缺失间隔感知时空编码器。
    # M0 仅通过 encoder_type=m0 作为历史对照，不作为默认入口。
    encoder_type: 'gast'
    gast_depth: 4
    gast_gsm_operator: 'max'
    # 时序方向：旧 GAST-PF 默认保留双向；Uni 变体显式改为因果单向 Mamba。
    gast_temporal_direction: 'bidirectional'
    # Legacy UT-ENC experiment keys: keep Hydra overrides loadable so the
    # unitraj_encoder_bench_seed2024 lanes can resume from their checkpoints.
    utenc_depth: 4
    utenc_gsm_operator: 'max'
    # Stage 1 · AnchorGeo 开关（默认关闭：基础版本行为不变）。
    gast_anchor_geo: false
    # Stage 2 · FrameGeo 开关（默认关闭：历史输入 4 维不变）。
    gast_frame_geo: false
    # Directional attention readout：双向完整状态池化，默认关闭以保持基线行为。
    gast_directional_readout: false
    # M0SceneTail：仅恢复 M0 编码后的 actor context 与场景交互尾部。
    gast_m0_scene_tail: false
    gast_ecsr: false
  pretrained_weights: ${pretrained_weights}
  lr: ${lr}
  weight_decay: ${weight_decay}
  epochs: ${epochs}
  warmup_epochs: ${warmup_epochs}
