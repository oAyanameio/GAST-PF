# TrajGap-Bench 统一 Mixed 配置。
# Easy/Hard 只作为底层官方文件来源，训练、验证和测试均由 TrajGap 合并。
# 用法（单场景 Mixed smoke）：
#   PYTHONPATH=. python train.py --config-name=config_missing_aware_trajimpute \
#     scene=ETH-M difficulty=Mixed train_difficulties=[Mixed] val_difficulties=[Mixed] \
#     hydra.run.dir=outputs/trajgap_smoke/GAST-PF_ETH-M
defaults:
  - datamodule: trajimpute
  - model: missing_aware_ethucy_model_forecast
  - _self_

hydra:
  run:
    dir: outputs/${output}/${now:%Y%m%d-%H%M%S}

seed: 2024
scene: ETH-M
difficulty: Mixed
train_difficulties: [Mixed]
val_difficulties: [Mixed]
train_sampling_scheme: natural
train_sampling_seed: ${seed}
# 选点指标：必须与最终评估输出头一致（new_y_hat/new_pi -> val_new_*）。
monitor: val_new_minFDE20
save_top_k: 1
# runner 注入：当前实验的 manifest 路径；train.py 据此在 checkpoint 中写入
# run contract 与 optimizer signature，供断点续训前做契约校验。
run_manifest_path:

data_root: /home/lbh/TrajImpute/dataset/TrajImpute
# TrajGap-Bench 正式主协议：所有训练、验证和测试均使用 Mixed。
# zero_missing_only 仅保留为底层数据诊断开关，不属于正式 benchmark。
zero_missing_only: false
checkpoint:
pretrained_weights:
output: trajgap_${model_version}_${scene}_${difficulty}${clean_suffix}
clean_suffix: ''

# trainer
num_workers: 4
gpus: 1
sync_bn: false
batch_size: 64
epochs: 100
warmup_epochs: 5
precision: bf16
# 主链 K=20 配置：正式模型 GAST-PF 的时序编码由内部前向/反向状态分支完成；
# bimamba 仅在显式切换到 M0 时作用于 M0 的历史编码器。
# 旧 uni/bi 对照产物继续保留在 outputs/ 中，不作为当前默认实验入口。
bimamba: false

# optimizer
# GAST-PF 基础策略：AdamW 参数分组覆盖所有可训练参数；自定义 mixer/RMSNorm
# 不在 decay 白名单时进入 no-decay 组，不允许被静默遗漏。
lr: 0.001
weight_decay: 0.0001
gradient_clip_val: 5
gradient_clip_algorithm: norm

limit_train_batches:
limit_val_batches:
limit_test_batches:
log_model: all
test: false

# 模型版本标签（仅用于 output 命名）；M0 对照运行时显式覆盖为 M0。
model_version: 'GAST-PF'

# TrajImpute 原始评估脚本使用 best-of-20；该覆盖只作用于 direct 配置，
# 历史 ETH/UCY train_adapt 配置保持 K=6。
model:
  target:
    model:
      num_modes: 20
