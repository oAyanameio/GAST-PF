# 主入口默认配置：GAST-PF TrajImpute 直接缺失预测；M0 通过显式 override 作为对照。
# 2026-09-13：自建 ETHUCY_benchmark_v1 已作废删除（重切窗口偏离预定义 LOO 划分），
# 本配置默认指向 TrajImpute 官方 release；完整历史 Clean 参照直接引用原论文数字。
defaults:
  - datamodule: trajimpute
  - model: missing_aware_ethucy_model_forecast

hydra:
  run:
    dir: outputs/${output}/${now:%Y%m%d-%H%M%S}

seed: 2024
scene: ETH-M
difficulty: Easy
# 选点指标：必须与最终评估输出头一致（new_y_hat/new_pi -> val_new_*）。
monitor: val_new_minFDE20
save_top_k: 1
# runner 注入：当前实验 manifest 路径，用于 checkpoint 契约校验。
run_manifest_path:

data_root: /home/lbh/TrajImpute/dataset/TrajImpute
zero_missing_only: false
checkpoint:
pretrained_weights:
output: trajimpute_${model_version}_${scene}_${difficulty}
clean_suffix: ''

# trainer
num_workers: 4
gpus: 1
sync_bn: false
batch_size: 64
epochs: 100
warmup_epochs: 5
precision: bf16
# GAST-PF 主链使用内部前向/反向时序状态编码；bimamba 仅用于 M0 对照路径。
bimamba: false

# optimizer
lr: 0.001
weight_decay: 0.0001
gradient_clip_val: 5
gradient_clip_algorithm: norm

limit_train_batches:
limit_val_batches:
limit_test_batches:
log_model: all
test: false

model_version: 'GAST-PF'

model:
  target:
    model:
      num_modes: 20
