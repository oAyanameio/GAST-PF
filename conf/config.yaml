# 主入口默认配置：GAST TrajImpute 直接缺失预测。
defaults:
  - datamodule: trajimpute
  - model: gast_model_forecast

hydra:
  run:
    dir: outputs/${output}/${now:%Y%m%d-%H%M%S}

seed: 2024
scene: ETH-M
difficulty: Easy
# 选点指标：必须与最终评估输出头一致（new_y_hat/new_pi -> val_new_*）。
monitor: val_new_minFDE20
save_top_k: 1
# runner 注入：当前实验 manifest 路径，用于 checkpoint 契约校验。
run_manifest_path:

data_root: /home/lbh/TrajImpute/dataset/TrajImpute
zero_missing_only: false
checkpoint:
pretrained_weights:
output: trajimpute_${model_version}_${scene}_${difficulty}
clean_suffix: ''

# trainer
num_workers: 4
gpus: 1
sync_bn: false
batch_size: 64
epochs: 100
warmup_epochs: 5
precision: bf16
# optimizer
lr: 0.001
weight_decay: 0.0001
gradient_clip_val: 5
gradient_clip_algorithm: norm

limit_train_batches:
limit_val_batches:
limit_test_batches:
log_model: all
test: false

model_version: 'GAST'

model:
  target:
    model:
      num_modes: 20
